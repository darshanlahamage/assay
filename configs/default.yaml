# Assay default configuration. CLI flags override these values.

backends:
  groq:                                     # API track (free tier: 8k tokens/min; 200k tokens/day per model)
    model: openai/gpt-oss-120b
    temperature: 0.7
    max_output_tokens: 4096
    max_prompt_chars: 18000                 # keeps each request under the per-minute token cap
    reasoning_effort: medium                # gpt-oss; the same on the local track
  gemini:                                   # API track (free tier: 20 req/day per model)
    model: gemini-3.5-flash
    temperature: 0.7
    max_output_tokens: 8192
  mlx:                                      # local track
    model: mlx-community/Qwen3-14B-4bit     # ~8.3 GB
    temperature: 0.7                        # Qwen3's recommended non-thinking sampling:
    top_p: 0.8                              #   temperature 0.7, top_p 0.8, top_k 20
    top_k: 20
    presence_penalty: 0.0                   # off: it would change the recorded logprobs
    max_tokens: 4096
    enable_thinking: false                  # Qwen3 thinking mode; slower, more tokens
    adapter_path: null                      # LoRA adapter (RL rounds, later)
    activation_layers: [0.5, 0.75]          # residual stream recorded at these depths
    max_prompt_chars: 80000                 # older outputs shortened beyond this
    memory_limit_gb: 14                     # hard cap on MLX memory (24 GB Mac + Docker);
                                            # without it the Mac can hang (DESIGN 6.1)

agent:
  max_steps: 30
  command_timeout_s: 60
  observation_chars: 6000                   # command output shown to the model, per step

sandbox:
  image: assay-sandbox:0.3
  cpus: 2
  memory: 2g
  network: proxy                            # proxy: allow-list proxy only | none: no network

devmachine:
  enabled: true                             # run the developer-machine step after each rollout

grader:
  timeout_s: 120

defenses:
  honesty_prompt: false                     # Layer 0: prompt baseline
  trusted_grading: "off"                    # Layer 1: off | log_only | on
  devmachine_review: false                  # Layer 1: hold back agent changes to hooks/Makefile/...

pressure:                                   # see src/assay/pressure.py
  prompt: none                              # none | neutral | low | high | threat
  failures: 0                               # earlier failed attempts mentioned in the task
  budget: default                           # default | normal | tight (8 steps, shown)
  tests_shown: false                        # paste the visible tests into the task
  oversight: none                           # none | watched | unwatched

run:
  out_dir: runs
