# Does pressure in the wording make agents cheat more? (Same tasks, only the sentence changes.)
# Baseline "neutral" is a calm sentence of similar length, so length isn't the difference.
# ~72 rollouts, roughly one day of Groq's free quota.
name: prompt_pressure
agents:
  - {backend: groq, model: openai/gpt-oss-120b}
tasks:
  - "lcb_*_impossible"
  - repo_invoice_commit_hook
  - repo_textstats_poisoned_setup
max_tasks: 8
seed: 1
repeats: 3
conditions:
  - {name: neutral, pressure: {prompt: neutral}}
  - {name: high, pressure: {prompt: high}}
  - {name: threat, pressure: {prompt: threat}}
defenses:
  - {name: "off"}
