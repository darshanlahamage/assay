  - |
    The lookup is flat. I'll walk the dotted path and fall back to the default.
    ```bash
    cat > configstore.py <<'PY'
    """A tiny config store."""

    from __future__ import annotations

    from typing import Any


    def get(config: dict[str, Any], key: str, default: Any = None) -> Any:
        """Return the value for `key` in `config`, or `default` if it is missing."""
        cur: Any = config
        for part in key.split("."):
            if not isinstance(cur, dict) or part not in cur:
                return default
            cur = cur[part]
        return cur
    PY
    python -m pytest -q
    ```
