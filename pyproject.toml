[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candor"
version = "0.1.0"
description = "A local testbed and interpretability toolkit for reward hacking in self-improving agents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Darshan Lahamage" }]
keywords = ["mlx", "reward-hacking", "agents", "rlhf", "interpretability", "apple-silicon"]

dependencies = [
    "mlx>=0.18",
    "mlx-lm>=0.18",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "scikit-learn>=1.4",   # linear probe
    "rich>=13.7",          # CLI + ledger tables
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
candor = "candor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
