# Agent containers sit on an internal Docker network with no route out. This proxy
# is their only path to the internet, and it only allows the hosts in `allowlist`.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 50
LogLevel Info
Allow 0.0.0.0/0
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
DisableViaHeader Yes
